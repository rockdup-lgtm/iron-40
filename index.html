<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Iron 40" />
<meta name="theme-color" content="#09080d" />
<title>Iron 40</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #09080d; --bg-2: #110e19; --surface: rgba(255,255,255,.035); --surface-solid: #15121e; --surface-2: rgba(255,255,255,.06);
  --line: rgba(255,255,255,.07); --line-strong: rgba(255,255,255,.12);
  --text: #f6f3fa; --muted: #8f879f; --faint: #5d566c;
  --accent: #ff3d6b; --accent-2: #ff7a59; --accent-ink: #ffffff;
  --grad: linear-gradient(135deg, #ff3d6b 0%, #ff6a5c 100%);
  --accent-soft: rgba(255,61,107,.12); --ok: #4ade9b; --danger: #ff5a6e; --gold: #e9c48a;
  --mus: #ff3d6b; --mus-sec: #a3477a; --mm-base: #2c2738; --mm-line: #0f0d15;
  --body-a: #8c84a3; --body-b: #3b3550; --body-far-a: #4a445c; --body-far-b: #25212f;
  --mus-a: #ff6b8a; --mus-b: #d0164a; --sec-a: #b9608f; --sec-b: #5e2a4b;
  --body: #5a5370; --bench: #262230; --plate: #1d1a25; --plate-ring: #9d96ad; --path: rgba(255,61,107,.45);
  --radius: 24px; --tab-h: 62px;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -24px rgba(0,0,0,.8);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f4f8; --bg-2: #ffffff; --surface: rgba(255,255,255,.85); --surface-solid: #ffffff; --surface-2: rgba(20,14,35,.05);
    --line: rgba(20,14,35,.08); --line-strong: rgba(20,14,35,.14);
    --text: #15111f; --muted: #6e677c; --faint: #a39cb0;
    --accent: #e8285a; --accent-soft: rgba(232,40,90,.09); --ok: #13a565; --danger: #d63c4f; --gold: #a67b35;
    --grad: linear-gradient(135deg, #e8285a 0%, #f2604a 100%);
    --mus: #e8285a; --mus-sec: #ef93ad; --mm-base: #d9d3e3; --mm-line: #f6f4f8;
    --body-a: #c9c1d8; --body-b: #9b91b0; --body-far-a: #e2dcea; --body-far-b: #c6bfd2;
    --mus-a: #ff6b8a; --mus-b: #d0164a; --sec-a: #f4b3c6; --sec-b: #e07c9b;
    --body: #b2a9c4; --bench: #d6d0e0; --plate: #2b2638; --plate-ring: #15111f; --path: rgba(232,40,90,.5);
    --shadow: 0 1px 2px rgba(20,14,35,.05), 0 18px 40px -26px rgba(20,14,35,.35);
    color-scheme: light;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 60%), var(--bg);
  color: var(--text);
  font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif; font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; transition: transform .15s ease, background .2s, opacity .2s; }
button:active { transform: scale(.97); }
input { font: inherit; color: inherit; }
.display { font-family: Sora, Inter, sans-serif; font-weight: 600; letter-spacing: -.03em; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.num { font-family: Sora, Inter, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }

/* ---------- layout ---------- */
.screen { display: none; padding: calc(env(safe-area-inset-top) + 20px) 20px calc(var(--tab-h) + env(safe-area-inset-bottom) + 44px); max-width: 640px; margin: 0 auto; }
.screen.active { display: block; animation: fade .45s cubic-bezier(.2,.8,.2,1); }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
h1 { font-size: 34px; line-height: 1.05; }
h2 { font-size: 24px; line-height: 1.15; }
h3 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); }
.stack > * + * { margin-top: 16px; }
.row { display: flex; align-items: center; gap: 10px; }
.spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 24px; border-radius: 18px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.btn-primary { background: var(--grad); color: var(--accent-ink);
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 12px 30px -10px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn-ghost { background: var(--surface-2); border: 1px solid var(--line); }
.btn-block { width: 100%; }
.chip { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--muted); }
.chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
.icon { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 4px; }

/* ---------- floating tab bar ---------- */
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 20; display: flex;
  width: min(420px, calc(100% - 32px)); padding: 6px; border-radius: 26px;
  background: color-mix(in srgb, var(--bg-2) 72%, transparent); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--line-strong); box-shadow: 0 20px 50px -18px rgba(0,0,0,.7); }
.tabs button { flex: 1; height: var(--tab-h); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; color: var(--faint); }
.tabs button.on { color: var(--text); background: var(--surface-2); }
.tabs button.on .icon { color: var(--accent); }

/* ---------- today ---------- */
.hero { position: relative; border-radius: 30px; overflow: hidden; min-height: 248px; display: flex; align-items: flex-end; padding: 24px;
  background:
    radial-gradient(70% 80% at 90% 0%, rgba(255,61,107,.55), transparent 60%),
    radial-gradient(60% 70% at 0% 100%, rgba(120,80,255,.35), transparent 60%),
    linear-gradient(160deg, #1d1729, #0b0910);
  color: #fff; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 60px -30px rgba(255,61,107,.35); }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::before { content: ''; position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 18px 18px; mask-image: linear-gradient(180deg, #000, transparent 70%); -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%); }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 25%, rgba(5,4,8,.85)); }
.hero > div { position: relative; z-index: 1; }
.hero h1 { font-size: 46px; line-height: .95; letter-spacing: -.045em; margin: 6px 0 8px; }
.hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .tag { color: rgba(255,255,255,.75); }
.hero .tag::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 2px; box-shadow: 0 0 10px var(--accent); }
.today-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 26px; margin-top: 2px; }
.brand em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; text-align: center; font-size: 11px; font-weight: 600; color: var(--faint); }
.dots i { display: block; height: 5px; border-radius: 3px; background: var(--surface-2); margin-top: 6px; }
.dots .train { color: var(--muted); }
.dots .done { color: var(--text); } .dots .done i { background: var(--grad); box-shadow: 0 0 10px -2px var(--accent); }
.dots .today { color: var(--text); } .dots .today i { outline: 1px solid var(--accent); outline-offset: 1px; }
.up-hero { display: block; min-height: 0; padding: 22px; }
.up-hero h1 { font-size: 40px; }
.up-hero .meta { color: rgba(255,255,255,.72); font-size: 13.5px; }
.up-hero .row2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 0; }
.up-hero .row2 .small { color: rgba(255,255,255,.7); text-align: right; }
.up-hero .note { margin-top: 10px; text-align: center; font-size: 12.5px; color: rgba(255,255,255,.6); }
.avatars { display: flex; }
.avatars .mini { width: 42px; height: 42px; border-radius: 14px; overflow: hidden; position: relative; flex: none; border: 2px solid #15111f;
  background: radial-gradient(80% 70% at 50% 35%, color-mix(in srgb, var(--accent) 12%, #15121e), #15121e); }
.avatars .mini img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.avatars .mini .rigbox { position: absolute; inset: 2px; }
.avatars > * + * { margin-left: -10px; }
.avatars .more { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font: 600 12px Sora, sans-serif; background: #241f30; border: 2px solid #15111f; color: rgba(255,255,255,.7); }
#exList summary { font-size: 14px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.tile2 { text-align: left; padding: 12px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; min-height: 66px; }
.tile2 .map { width: 34px; height: 46px; flex: none; }
.tile2 b { display: block; font-size: 14px; font-weight: 600; }
.tile2 small { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.tile2.on { border-color: color-mix(in srgb, var(--accent) 65%, transparent); background: var(--accent-soft); }
.tile2.wide { grid-column: span 2; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px 14px; box-shadow: var(--shadow); }
.stat b { display: block; font-family: Sora, sans-serif; font-weight: 500; font-size: 30px; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.stat b small { font-size: 15px; color: var(--faint); font-weight: 400; }
.stat span { display: block; margin-top: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ex-line { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.ex-line:first-of-type { border-top: 0; }
.ex-line .media { width: 72px; height: 72px; border-radius: 18px; }
.ex-line .chev { color: var(--faint); margin-left: auto; }
.recov-head { display: grid; grid-template-columns: 1fr 1px 1fr; text-align: center; gap: 10px; align-items: center; }
.recov-head i { width: 1px; height: 64px; background: var(--line-strong); }
.recov-head b { display: block; font-family: Sora, sans-serif; font-weight: 500; font-size: 52px; line-height: 1; letter-spacing: -.05em; }
.recov-head span { display: block; margin-top: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.recov-map { max-width: 420px; margin: 0 auto; padding: 8px 0; background: radial-gradient(50% 45% at 50% 50%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 70%); }
.recov-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.meter { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #2bbf7f, var(--ok)); }
.meter i.low { background: var(--grad); } .meter i.mid { background: linear-gradient(90deg, #f29b3a, #f7c35c); }

/* ---------- rig (mannequin) ---------- */
.rig { width: 100%; height: 100%; display: block; overflow: visible; }
.rig .ground { stroke: none; }
.rig .m { fill: url(#g-body); stroke: var(--mm-line); stroke-width: .7; stroke-linejoin: round; }
.rig .m.joint, .rig .m.head { stroke: none; }
.rig .m.on { fill: url(#g-mus); }
.rig .m.sec { fill: url(#g-sec); }
.rig .far .m { fill: url(#g-body-far); }
.rig .far .m.on { fill: var(--mus-b); opacity: .75; }
.rig .far .m.sec { fill: var(--sec-b); }
.rig .neck { stroke: var(--body); stroke-width: 9; stroke-linecap: round; }
.stage .rig .near .m.on { filter: url(#f-glow); }
.rig .bench, .rig .bench-leg { fill: url(#g-bench); }
.rig .bench-pad { stroke: var(--bench); stroke-width: 9; stroke-linecap: round; }
.rig .plate { fill: url(#g-plate); stroke: var(--plate-ring); stroke-width: 1.5; stroke-opacity: .8; }
.rig .bar .plate { stroke-width: 2.5; }
.rig .hub { fill: var(--plate-ring); }
.rig .far-prop { opacity: .5; }
.rig .wpath { fill: none; stroke: var(--path); stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; }
.rig .ghost { opacity: .18; }
.rig .floor { fill: url(#g-floor); }

/* ---------- muscle map ---------- */
.musclemap { display: block; width: 100%; height: 100%; overflow: visible; }
.musclemap .mm, .musclemap .mm-base { fill: var(--mm-base); stroke: var(--mm-line); stroke-width: .7; stroke-linejoin: round; }
.recov-map .musclemap .mm, .recov-map .musclemap .mm-base, .detailmap .musclemap .mm, .detailmap .musclemap .mm-base { fill: url(#g-map); }
.mapwrap { position: relative; }
.bubble { position: absolute; transform: translate(-50%, -115%); padding: 4px 9px; border-radius: 999px; background: rgba(20,14,28,.75); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
  color: #fff; font: 600 11.5px/1 Sora, sans-serif; letter-spacing: -.01em; white-space: nowrap; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 6px 16px -6px var(--accent); }
.media { position: relative; border-radius: 18px; overflow: hidden; flex: none;
  background: radial-gradient(80% 70% at 50% 35%, color-mix(in srgb, var(--accent) 10%, var(--surface-solid)), var(--surface-solid)); }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.media .rigbox { position: absolute; inset: 4px; }
.media .inset { position: absolute; right: 4px; bottom: 4px; width: 32%; height: 44%; border-radius: 10px; padding: 3px;
  background: rgba(12,10,18,.72); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.stage { position: relative; border-radius: 28px; aspect-ratio: 240 / 228; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow);
  background: radial-gradient(60% 55% at 50% 45%, color-mix(in srgb, var(--accent) 14%, var(--bg-2)), var(--bg) 85%); }
.stage::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: 0; height: 30%; pointer-events: none;
  background: radial-gradient(50% 60% at 50% 100%, rgba(255,255,255,.06), transparent 70%); }
.stage .phase { position: absolute; left: 14px; top: 14px; z-index: 1; padding: 7px 12px 7px 10px; border-radius: 999px; background: rgba(12,10,18,.6); border: 1px solid var(--line-strong);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 8px; }
.stage .phase::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.stage .ctrls { position: absolute; right: 12px; top: 12px; z-index: 1; display: flex; gap: 6px; }
.stage .ctrls button { width: 38px; height: 38px; border-radius: 13px; background: rgba(12,10,18,.6); border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 12px; font-weight: 600; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.stage .ctrls button.on { background: var(--text); color: var(--bg); }
.scrub { margin-top: 12px; padding: 0 2px; }
.scrub input { width: 100%; height: 28px; margin: 0; accent-color: var(--accent); cursor: grab; touch-action: none; }
.scrub-labels { display: flex; gap: 4px; margin-top: 2px; }
.scrub-labels span { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); padding-top: 6px; border-top: 2px solid var(--line-strong); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scrub-hint { text-align: center; margin-top: 6px; font-size: 12px; }
.photo { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 28px; display: block; }

/* ---------- library ---------- */
.filters { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; text-align: left; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.tile .media { aspect-ratio: 1; border-radius: 0; }
.tile .meta { padding: 12px 14px 14px; }
.tile h3 { font-size: 14px; line-height: 1.3; }
.tile .small { font-size: 12px; margin-top: 2px; }

/* ---------- sheet / overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; display: none;
  padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 28px); }
.overlay.open { display: block; animation: rise .4s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.overlay .inner { max-width: 640px; margin: 0 auto; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 10px; }
.iconbtn { width: 44px; height: 44px; border-radius: 15px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.cues { counter-reset: cue; list-style: none; }
.cues li { counter-increment: cue; display: flex; gap: 12px; margin-top: 12px; }
.cues li::before { content: counter(cue); flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 Sora, sans-serif; background: var(--surface-2); border: 1px solid var(--line-strong); }
.callout { padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
.callout::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--grad); }
.callout b { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.callout.warn b { color: var(--danger); }
.callout.warn::before { background: var(--danger); }
.swap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swap div { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; font-weight: 500; }
.swap .small { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }

/* ---------- workout ---------- */
.progress { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; flex: 1; }
.progress i { display: block; height: 100%; background: var(--grad); transition: width .5s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 12px var(--accent); }
.sets { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
.sets th { font-size: 10.5px; color: var(--muted); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; text-align: center; padding: 0 6px; }
.sets td { padding: 0 4px; }
.sets td:first-child { width: 40px; text-align: center; color: var(--faint); font: 500 15px Sora, sans-serif; }
.sets input { width: 100%; height: 54px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-align: center; font: 500 20px Sora, sans-serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.sets input:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 4px var(--accent-soft); }
.check { width: 54px; height: 54px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--faint); }
.check.on { background: linear-gradient(135deg, #3fe39a, #1fb877); border-color: transparent; color: #03200f; box-shadow: 0 8px 20px -8px rgba(63,227,154,.7); }
.sets input[readonly] { cursor: pointer; caret-color: transparent; }

/* weight / reps wheel */
.wsheet { position: fixed; inset: 0; z-index: 70; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.45); }
.wsheet.open { display: flex; animation: fade .2s ease; }
.ws-card { width: 100%; max-width: 520px; background: var(--surface-solid); border-radius: 28px 28px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line-strong); animation: wsUp .28s cubic-bezier(.2,.9,.3,1); }
@keyframes wsUp { from { transform: translateY(40%); } }
.ws-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.ws-head b { font: 600 18px Sora, sans-serif; }
.ws-link { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 14px; padding: 6px; }
.ws-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.ws-col { position: relative; }
.ws-label { text-align: center; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
.ws-col::after { content: ''; position: absolute; left: 0; right: 0; top: calc(22px + 88px); height: 44px; border-radius: 14px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); pointer-events: none; }
.wheel { height: 220px; overflow-y: auto; scroll-snap-type: y mandatory; padding: 88px 0; perspective: 600px; scrollbar-width: none; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wi { height: 44px; display: grid; place-items: center; scroll-snap-align: center; font: 500 24px Sora, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -.02em; position: relative; z-index: 1; }
.ws-btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }

/* PR celebration */
.pr-burst { display: none; text-align: center; padding: 14px 20px; border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, #ffb020 22%, transparent), color-mix(in srgb, var(--accent) 18%, transparent)); border: 1px solid color-mix(in srgb, #ffb020 50%, transparent); max-width: 340px; }
.pr-burst.on { display: block; animation: prPop .5s cubic-bezier(.2,1.6,.4,1); }
.pr-burst .t { font: 700 13px Sora, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: #ffb020; }
.pr-burst .v { font: 600 20px Sora, sans-serif; letter-spacing: -.02em; margin-top: 4px; }
.pr-burst .small { margin-top: 2px; }
@keyframes prPop { from { transform: scale(.6); opacity: 0; } }
#confetti { position: fixed; inset: 0; z-index: 80; pointer-events: none; width: 100%; height: 100%; }

/* streak flame + training heatmap */
.pill.flame::before { display: none; }
.flame-ic { width: 16px; height: 18px; margin: -2px -1px -2px -3px; transform-origin: 50% 90%; }
.flame-ic.lit { animation: flicker 1.6s ease-in-out infinite; filter: drop-shadow(0 0 5px rgba(255,140,40,.6)); }
.flame-ic.out { filter: grayscale(1); opacity: .45; }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(0); } 30% { transform: scale(1.06,.96) rotate(-3deg); } 60% { transform: scale(.96,1.05) rotate(2deg); } }
@media (prefers-reduced-motion: reduce) { .flame-ic.lit { animation: none; } }
.hm-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 14px; }
.hm-stats div { background: var(--surface-2); border-radius: 14px; padding: 10px; }
.hm-stats b { display: flex; align-items: center; gap: 4px; font: 600 22px Sora, sans-serif; letter-spacing: -.03em; }
.hm-stats b .flame-ic { width: 20px; height: 22px; margin: 0; }
.hm-stats span { font-size: 11.5px; color: var(--muted); }
.hm-months { display: grid; gap: 3px; height: 16px; font-size: 9.5px; color: var(--faint); }
.hm-months, .hm { grid-template-columns: 12px repeat(var(--wks), minmax(0, 1fr)); }
.hm b { font-size: 9px; font-weight: 500; color: var(--faint); display: grid; align-items: center; }
.hm-months span { white-space: nowrap; overflow: visible; }
.hm { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.hm button { aspect-ratio: 1; border-radius: 3px; border: 0; padding: 0; background: var(--surface-2); }
.hm button.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface-solid)); }
.hm button.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--surface-solid)); }
.hm button.l3 { background: color-mix(in srgb, var(--accent) 80%, var(--surface-solid)); }
.hm button.l4 { background: var(--accent); }
.hm button.today { outline: 1.5px solid var(--text, currentColor); outline-offset: 1px; }
.hm button.sel { outline: 2px solid #ffb020; outline-offset: 1px; }
.hm i { aspect-ratio: 1; }
.hm-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; font-size: 12px; color: var(--muted); min-height: 18px; }
.hm-legend { display: flex; align-items: center; gap: 3px; font-size: 10.5px; flex: none; }
.hm-legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--surface-2); }
tr.done input { opacity: .55; }
.hint { font-size: 13px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.hint.up { background: color-mix(in srgb, var(--ok) 10%, transparent); border-color: color-mix(in srgb, var(--ok) 30%, transparent); color: var(--ok); font-weight: 600; }
.wu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.wu-grid .stage { border-radius: 20px; }
.footer-nav { position: sticky; bottom: 0; display: flex; gap: 10px; padding: 18px 0 6px; background: linear-gradient(transparent, var(--bg) 35%); }
.footer-nav .btn { flex: 1; }
.footer-nav .btn-ghost { flex: .55; }
details summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details summary::after { content: '+'; font: 300 22px/1 Sora, sans-serif; color: var(--muted); transition: transform .2s; }
details[open] summary::after { transform: rotate(45deg); }
details summary::-webkit-details-marker { display: none; }

/* rest timer */
.rest { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  background: radial-gradient(60% 40% at 50% 45%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%), color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 24px; }
.rest.open { display: flex; animation: fade .3s ease; }
.ring { width: 260px; height: 260px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 6; }
.ring .track { stroke: var(--surface-2); }
.ring .bar { stroke: url(#g-ring); stroke-linecap: round; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 70%, transparent)); transition: stroke .4s; }
.ring .ticks line { stroke: var(--line-strong); stroke-width: .8; stroke-linecap: round; transition: stroke .3s; }
.ring .ticks line.big { stroke-width: 1.4; }
.ring .ticks line.lit { stroke: color-mix(in srgb, var(--accent) 55%, transparent); }
.ring .dot { fill: #fff; filter: drop-shadow(0 0 6px var(--accent)); transition: fill .4s; }
.ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; }
.ring .num b { font: 300 84px/1 Sora, sans-serif; letter-spacing: -.06em; font-variant-numeric: tabular-nums; transition: color .4s; }
.ring .num small { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ring { --amber: #ffb020; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .ring { --amber: #f08c00; } }
:root[data-theme="light"] .ring { --amber: #f08c00; }
.ring.soon .bar { stroke: var(--amber); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--amber) 70%, transparent)); }
.ring.soon .dot { filter: drop-shadow(0 0 6px var(--amber)); }
.ring.soon .ticks line.lit { stroke: color-mix(in srgb, var(--amber) 60%, transparent); }
.ring.soon .num b { color: var(--amber); }
.ring.final .num b { animation: restPulse 1s ease-in-out infinite; }
.ring.done .bar { stroke: var(--ok); }
.ring.done .num b { color: var(--ok); }
@keyframes restPulse { 0%,100% { transform: scale(1); } 40% { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .ring.final .num b { animation: none; } }

/* history */
.hist { display: flex; gap: 14px; align-items: center; padding: 4px 0; }
.hist .badge { width: 48px; height: 48px; border-radius: 16px; background: var(--grad); color: #fff; display: grid; place-items: center; font: 600 18px Sora, sans-serif; flex: none; box-shadow: 0 8px 20px -10px var(--accent); }
.lifts td { padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.lifts tr:first-child td { border-top: 0; }
.lifts td:last-child { text-align: right; font: 500 17px Sora, sans-serif; letter-spacing: -.02em; }
.lifts { width: 100%; border-collapse: collapse; }
.empty { text-align: center; padding: 44px 20px; color: var(--muted); }

/* modal */
.modal { position: fixed; inset: 0; z-index: 80; display: none; align-items: flex-end; justify-content: center; background: rgba(4,3,8,.6); padding: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.modal.open { display: flex; animation: fade .3s ease; }
.modal .card { max-width: 480px; width: 100%; margin-bottom: env(safe-area-inset-bottom); background: var(--surface-solid); border-color: var(--line-strong); border-radius: 30px; padding: 22px; }
.modal .card { max-height: calc(100% - env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain; } /* tall sheets (profile) scroll instead of running off the top */
.modal .seg { display: flex; gap: 8px; }
.data-btn { min-height: 44px; padding: 0 16px; font-size: 14px; flex: 1; }
.vid .yt, .vid .yt-frame { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; margin-top: 10px; border-radius: 18px; overflow: hidden; border: 0; background: #000; }
.vid .yt img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; }
.vid .yt-play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; box-shadow: 0 10px 30px -8px var(--accent); }
.vid .yt-play svg { width: 26px; height: 26px; fill: #fff; margin-left: 3px; }
.vid-meta { margin-top: 8px; }
.vid-off { display: none; margin-top: 8px; }
.vid.offline .yt { display: none; } .vid.offline .vid-off { display: block; }
.locked-stage { aspect-ratio: 240 / 160; }
.locked-stage .rig { position: absolute; inset: 8px; width: auto; height: auto; filter: blur(3px); opacity: .45; }
.lock-over { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 20px; }
.lock-over .lock { width: 28px; height: 28px; color: var(--accent); }
.lock-over b { font: 600 18px Sora, sans-serif; }
.lock-over .small { color: var(--muted); max-width: 260px; }
.lock-over .btn { margin-top: 8px; min-height: 46px; }
.vid-locked { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-align: left; font-size: 14px; color: var(--muted); }
.vid-locked .lock { width: 18px; height: 18px; color: var(--accent); flex: none; }
.swap-btn { min-height: 38px; padding: 0 14px; font-size: 13px; border-radius: 12px; flex: none; margin-top: 4px; }
.swap-note { color: var(--ok); margin-top: 4px; }
.swap-opt.on { background: var(--accent-soft); border-radius: 16px; }
.chips-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.effort { width: min(360px, 100%); text-align: center; }
.effort .seg { display: flex; gap: 6px; margin-top: 8px; }
.effort .chip { flex: 1; justify-content: center; padding: 10px 6px; font-size: 13px; }
.effort-help { margin-top: 6px; font-size: 11.5px; }
.effort .chip.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 8px 20px -10px var(--accent); }
.easy-card { border-color: color-mix(in srgb, var(--ok) 35%, transparent); background: color-mix(in srgb, var(--ok) 7%, var(--surface)); }
.chart { margin-top: 10px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--faint); font: 500 9.5px Inter, sans-serif; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--accent); stroke: var(--surface-solid); stroke-width: 2; }
.chart .dot.pr { fill: var(--gold); }
.chart .dot.sel { r: 6; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .lbl { fill: var(--text); font: 600 10px Inter, sans-serif; }
.chart-read { margin-top: 4px; text-align: center; }
.pr-row { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 0; border-top: 1px solid var(--line); }
.pr-row:first-of-type { border-top: 0; }
.pr-row span:last-child { display: flex; flex-direction: column; }
.pr-badge { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font: 700 11px Sora, sans-serif; color: #2a1d05; background: linear-gradient(135deg, #f3d398, var(--gold)); }
.lifts tr[data-ex] { cursor: pointer; }
.body-go { min-height: 42px; padding: 0 16px; font-size: 14px; border-radius: 14px; }
.body-card { padding: 14px 10px 10px; background: radial-gradient(55% 50% at 50% 45%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 75%), var(--surface); }
.body-map { max-width: 520px; margin: 0 auto; }
.body-map .musclemap { -webkit-tap-highlight-color: transparent; }
.body-map .musclemap .mm-base { fill: url(#g-map); }
/* anatomy-chart look: every muscle tinted, then recovery / selection colours layered on top */
.body-map.anat .musclemap .mm:not(.mm-base) { fill: color-mix(in srgb, #c24a63 34%, var(--mm-base)); stroke: color-mix(in srgb, #ff8aa3 30%, var(--mm-line)); }
.body-modes { display: flex; gap: 6px; margin: 0 6px 10px; }
.body-modes .chip { flex: 1; justify-content: center; gap: 4px; padding: 8px 6px; }
.body-modes .lock { width: 12px; height: 12px; }
.ramp { display: inline-block; width: 46px; height: 7px; border-radius: 4px; vertical-align: 1px; margin-right: 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--mus) 25%, var(--mm-base)), var(--mus)); }
.body-map .musclemap .mm:not(.mm-base):hover { fill: color-mix(in srgb, #c24a63 55%, var(--mm-base)); }
.body-lbl { position: absolute; transform: translate(-50%, -50%); font: 600 9.5px/1 Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: rgba(255,255,255,.82); text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; white-space: nowrap; }
.body-views { padding: 6px 18px 0; }
.tile2.locked { opacity: .72; }
.tile2 .lock, .unlock-link .lock, .paywall .lock { width: 16px; height: 16px; flex: none; color: var(--muted); }
.tile2 .lock { margin-left: auto; align-self: flex-start; }
.unlock-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--accent); }
.unlock-link .lock { color: var(--accent); width: 14px; height: 14px; }
.paywall .lock { width: 40px; height: 40px; color: var(--accent); }
.paywall .btn { margin-top: 16px; }
.perks { list-style: none; display: grid; gap: 8px; font-size: 14px; }
.perks li { padding-left: 24px; position: relative; }
.perks li::before { content: '✓'; position: absolute; left: 0; color: var(--ok); font-weight: 700; }
.lic { flex: 1; min-width: 0; height: 52px; border-radius: 16px; border: 1px solid var(--line-strong); background: var(--surface); padding: 0 14px; font: 500 15px Inter, sans-serif; color: var(--text); }
.lic:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 70%, transparent); box-shadow: 0 0 0 4px var(--accent-soft); }
.modal .seg .chip { flex: 1; justify-content: center; padding: 12px 14px; font-size: 15px; }
#profileBtn { width: 38px; height: 38px; border-radius: 13px; }
#profileBtn .icon { width: 18px; height: 18px; }
.modal img { width: 100%; border-radius: 20px; aspect-ratio: 16/9; object-fit: cover; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--body-a)"/><stop offset="1" style="stop-color:var(--body-b)"/></linearGradient>
    <linearGradient id="g-body-far" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--body-far-a)"/><stop offset="1" style="stop-color:var(--body-far-b)"/></linearGradient>
    <linearGradient id="g-mus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--mus-a)"/><stop offset="1" style="stop-color:var(--mus-b)"/></linearGradient>
    <linearGradient id="g-sec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--sec-a)"/><stop offset="1" style="stop-color:var(--sec-b)"/></linearGradient>
    <linearGradient id="g-map" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb, var(--mm-base) 80%, #fff)"/><stop offset="1" style="stop-color:var(--mm-base)"/></linearGradient>
    <linearGradient id="g-bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb, var(--bench) 70%, #fff)"/><stop offset=".25" style="stop-color:var(--bench)"/><stop offset="1" style="stop-color:color-mix(in srgb, var(--bench) 70%, #000)"/></linearGradient>
    <radialGradient id="g-plate" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#4a4456"/><stop offset=".6" stop-color="#1b1822"/><stop offset="1" stop-color="#0c0b10"/></radialGradient>
    <radialGradient id="g-floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff3d6b"/><stop offset=".55" stop-color="#ff8a2a"/><stop offset="1" stop-color="#ffd23f"/></linearGradient>
    <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d6b"/><stop offset="1" stop-color="#ff8a5c"/></linearGradient>
    <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 0  0 .2 0 0 0  0 0 .35 0 0  0 0 0 .7 0" result="c"/><feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>

<!-- ============ TODAY ============ -->
<!-- ============ BODY (opening screen) ============ -->
<section class="screen active" id="s-body">
  <div class="stack">
    <div class="today-top">
      <div><div class="eyebrow" id="bodyTag" data-i18n>Tap a muscle</div><h2 class="display brand">Iron <em>40</em></h2></div>

    </div>

      <div class="seg body-modes" id="bodyModes"><button class="chip" data-mode="muscles" data-i18n>Muscles</button><button class="chip" data-mode="recovery" data-i18n>Recovery</button><button class="chip" data-mode="week" data-i18n>This week</button></div>
      <div class="mapwrap body-map" id="bodyMap"></div>
      <div class="row small muted body-views"><span data-i18n>Front</span><span class="spacer"></span><span id="bodyLegend"></span><span class="spacer"></span><span data-i18n>Back</span></div>
    </div>
    <div class="filters" id="bodyChips"></div>
    <div id="bodyPick"></div>
  </div>
</section>

<section class="screen" id="s-today">

    <div>
      <div class="today-top">
        <div><div class="eyebrow" id="todayTag" data-i18n>Today</div><h2 class="display brand">Iron <em>40</em></h2></div>
        <div class="row" style="gap:8px"><div class="pill" id="streakPill"></div>
          <button class="iconbtn" id="profileBtn" aria-label="Your profile" data-i18n-aria><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></button></div>
      </div>
      <div class="dots" id="week"></div>
    </div>
    <div id="easyCard"></div>

<!-- ============ LIBRARY ============ -->
<section class="screen" id="s-library">

<script src="exercises.js"></script>
<script src="i18n.js"></script>

<script src="i18n-data.js"></script>
<script>
translateStatic(); // UI text in the chosen language (exercise data is overlaid by i18n-data.js)
// =====================================================
// Storage (wrapped: private mode / blocked storage must not break the app)
// =====================================================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let log = store.get('iron40_log', []);          // [{date, day, mins, ex:[{id, sets:[{w,r,done}]}]}]
let active = store.get('iron40_active', null);  // in-progress workout
let profile = store.get('iron40_profile', null); // {sex: 'm'|'f', age: '30'|'40'} — tailors photos, tips, recovery
const P = () => profile || { sex: 'm', age: '40' };
// ---- $7.99 unlock: Workout A, the exercise library and profiles are free; the rest needs a license key ----
const SHOP = { price: '$7.99', checkoutUrl: 'https://digitalrougex.lemonsqueezy.com/checkout/buy/67f0e0af-4df0-453f-9b9e-728914e781c8' }; // set checkoutUrl to the Lemon Squeezy buy link
let license = store.get('iron40_license', null); // {key, id, at, expires?} once activated
// Friend trials expire; the start date stays so the same phone can't restart the trial
if (license && license.expires && Date.now() > license.expires) { license = null; store.del('iron40_license'); store.set('iron40_trialEnded', true); }
const trialDaysLeft = () => (license && license.expires ? Math.max(0, Math.ceil((license.expires - Date.now()) / 864e5)) : null);
// Build a license from a successful activation; trial codes get an expiry (and are refused if this phone already used one)
function licenseFrom(key, data) {
  if (data.id !== 'trial') return { key, id: data.id, at: Date.now() };
  const started = store.get('iron40_trialStart', null);
  if (started && Date.now() - started > 864e5) throw new Error(t('This phone has already used its free trial.'));
  const at = started || Date.now();
  store.set('iron40_trialStart', at);
  return { key, id: 'trial', at, expires: at + data.days * 864e5 };
}
const FREE_DAYS = ['A'];
const isLocked = (key) => !license && !FREE_DAYS.includes(key);
// Free sample: Workout A's exercises are fully free; every other move's animated demo, scrubber and video need the unlock
const FREE_EX = new Set(FREE_DAYS.flatMap((d) => PROGRAM[d].items.map((i) => i.id)));
const exLocked = (id) => !license && !FREE_EX.has(id);
const LOCK = '<svg class="icon lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const photo = (id) => `img/${P().sex === 'f' ? 'f/' : ''}${id}.jpg`;

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAYS = [t('Sun'), t('Mon'), t('Tue'), t('Wed'), t('Thu'), t('Fri'), t('Sat')];
const TRAIN_DAYS = [1, 3, 5];
const dayKey = (d) => d.toISOString().slice(0, 10);
const localKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const imgTag = (id, cls = '') => `<img class="${cls}" src="${photo(id)}" alt="" loading="lazy" onerror="this.remove()">`;

const ICON = {
  check: '<svg class="icon" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></svg>',
  close: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  back: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  play: '<svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M7 5v14l11-7z" fill="currentColor"/></svg>',
  pause: '<svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg>',
};

// =====================================================
// Program logic
// =====================================================
// Gym days alternate A/B; calisthenics sessions don't shift the rotation.
const nextDay = () => { const g = log.findLast((l) => l.day === 'A' || l.day === 'B'); return g && g.day === 'A' ? 'B' : 'A'; };
let pick = store.get('iron40_pick', null); // workout chosen on the Today screen (null = A/B rotation)
const upNext = () => {
  if (active) return active.day;
  const d = pick && PROGRAM[pick] ? pick : nextDay();
  return isLocked(d) ? 'A' : d; // free users stay on the free workout
};

function lastFor(id) {
  for (let i = log.length - 1; i >= 0; i--) {
    const e = log[i].ex.find((x) => x.id === id && x.sets.some((s) => s.done));
    if (e) return e;
  }
  return null;
}
// Double progression: once every set hits the top of the range, add weight.
// =====================================================
// Joint-friendly swaps + equipment: every workout adapts to the profile
// =====================================================
const gearOf = () => P().gear || Object.keys(GEAR);
const protectOf = () => P().protect || [];
const fits = (e) => e.equip.every((q) => q === 'Bodyweight' || gearOf().includes(q)) && !(STRESS[e.id] || []).some((j) => protectOf().includes(j));
function whyNot(e) {
  const gear = e.equip.find((q) => q !== 'Bodyweight' && !gearOf().includes(q));
  if (gear) return t('no {gear}', { gear: GEAR[gear].toLowerCase() });
  const j = (STRESS[e.id] || []).find((x) => protectOf().includes(x));
  return j ? t('easier on your {joint}', { joint: JOINTS[j].toLowerCase() }) : '';
}
// Best replacements: same main muscles first, then shared secondary muscles and the same movement group
function alternatives(id, timed) {
  const o = EX_BY_ID[id];
  return EXERCISES.filter((e) => e.id !== id && fits(e) && !!e.timed === !!timed)
    .map((e) => ({ e, score: e.mus.p.filter((m) => o.mus.p.includes(m)).length * 3 + e.mus.s.filter((m) => o.mus.s.includes(m) || o.mus.p.includes(m)).length + (e.group === o.group ? 1 : 0) }))
    .filter((x) => x.score >= 3).sort((a, b) => b.score - a.score).map((x) => x.e);
}
function personalize(item, used = new Set()) {
  const e = EX_BY_ID[item.id];
  if (fits(e)) return { id: item.id };
  const alt = alternatives(item.id, item.timed).find((x) => !used.has(x.id));
  return alt ? { id: alt.id, why: t('Swapped from {name}: {why}', { name: e.name, why: whyNot(e) }) } : { id: item.id, warn: t('Go light: {why}', { why: whyNot(e) }) };
}

// =====================================================
// Easy weeks: every 5th training week (6th in your 30s) is lighter so joints and tendons catch up
// =====================================================
const weekOf = (dateKey) => { const d = new Date(dateKey + 'T12:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return localKey(d); };
function easyWeek() {
  const now = weekOf(localKey(new Date())), last = store.get('iron40_lastEasy', null);
  if (last === now) return log.some((l) => l.easy && weekOf(l.date) === now) || false; // already did (or skipped) this week
  const weeks = new Set(log.filter((l) => !last || weekOf(l.date) > last).map((l) => weekOf(l.date)));
  weeks.delete(now);
  return weeks.size >= (P().age === '30' ? 5 : 4);
}

function personalizePlan(items) {
  const used = new Set(items.filter((it) => fits(EX_BY_ID[it.id])).map((it) => it.id));
  return items.map((it) => { const pe = personalize(it, used); used.add(pe.id); return pe; });
}

// Bodyweight moves progress by reps, then by moving to the harder variation.
function suggest(item) {
  const last = lastFor(item.id), ex = EX_BY_ID[item.id];
  const unit = item.timed ? t('sec') : t('reps');
  if (ex.bw && !last) return { w: '', text: t('Aim for {lo}–{hi} clean {unit}. Too hard? {easier}.', { lo: item.lo, hi: item.hi, unit, easier: ex.easier }) };
  if (!last) return { w: '', text: t('First time: choose a weight you could do for ~3 more {unit} than the target.', { unit }) };
  const done = last.sets.filter((s) => s.done);
  const w = Math.max(0, ...done.map((s) => +s.w || 0));
  const hitTop = done.length >= item.sets && done.every((s) => +s.r >= item.hi);
  if (ex.bw && !w) {
    const allOut = done.filter((s) => s.rir != null).every((s) => s.rir === 0) && done.some((s) => s.rir != null);
    if (hitTop && !allOut) return { w: '', up: true, text: t('You hit {hi} {unit} on every set last time — level up: {harder}.', { hi: item.hi, unit, harder: ex.harder }) };
    if (hitTop) return { w: '', text: t('You hit {hi} {unit} last time, but it was all-out. Repeat it until it feels solid.', { hi: item.hi, unit }) };
    return { w: '', text: t('Last time best {n} {unit}. Stay here until every set reaches {hi}.', { n: Math.max(...done.map((s) => +s.r || 0)), unit, hi: item.hi }) };
  }
  const rated = done.filter((s) => s.rir != null), grind = rated.length && rated.reduce((a, s) => a + s.rir, 0) / rated.length < 0.75;
  if (hitTop && w > 0 && grind) return { w, text: t('You hit {hi} {unit} last time, but it was all-out. Stay at {w} lb until it feels solid.', { hi: item.hi, unit, w }) };
  if (hitTop && w > 0) return { w: w + 5, up: true, text: t('You hit {hi} {unit} on every set last time — go up to {w} lb (+5).', { hi: item.hi, unit, w: w + 5 }) };
  // Stalled: same weight for the last 3 sessions without hitting the top → back off 10% and build again
  const recent = liftHistory(item.id).slice(-3);
  if (w > 0 && recent.length === 3 && recent.every((p) => p.w === w) && recent[2].v <= recent[0].v) {
    const back = Math.max(5, Math.round((w * 0.9) / 5) * 5);
    return { w: back, text: t("Stuck at {w} lb for 3 sessions. Drop to {back} lb today and build back up — that's how you break through.", { w, back }) };
  }
  return { w: w || '', text: w ? t('Last time {w} lb. Stay here until all sets reach {hi} {unit}.', { w, hi: item.hi, unit }) : '' };
}

// =====================================================
// Tabs
// =====================================================
function showTab(name) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('active', s.id === 's-' + name));
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  store.set('iron40_tab', name);
  if (name === 'body') renderBody();
  if (name === 'today') renderToday();
  if (name === 'library') renderLibrary();
  if (name === 'history') renderHistory();
  if (name === 'recovery') renderRecovery();
  window.scrollTo(0, 0);
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });

// photo (if generated) over a still mannequin, with a muscle-map inset
function mediaHtml(id, cls = '') {
  return `<div class="media ${cls}" data-media="${id}"><div class="rigbox"></div>${imgTag(id)}<div class="inset">${MuscleMap.forExercise(EX_BY_ID[id])}</div></div>`;
}
function mountMedia(root) {
  root.querySelectorAll('[data-media] .rigbox').forEach((b) => { if (!b.firstChild) IronRig.create(b, EX_BY_ID[b.parentElement.dataset.media], { static: true }); });
}

// =====================================================
// TODAY
// =====================================================
// muscle-map levels for a workout: every primary muscle it trains
const progLevels = (key) => Object.fromEntries(PROGRAM[key].items.flatMap((it) => EX_BY_ID[it.id].mus.p).map((m) => [m, 1]));
const progTitle = (prog) => (prog.cali ? esc(prog.chip) : esc(prog.name).replace(/ (\w)$/, ' <em>$1</em>'));

function renderToday() {
  const now = new Date();
  const doneDates = new Set(log.map((l) => l.date));
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  let weekDone = 0, weekHtml = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const k = localKey(d), done = doneDates.has(k);
    if (done) weekDone++;
    const cls = [TRAIN_DAYS.includes(d.getDay()) ? 'train' : '', done ? 'done' : '', k === localKey(now) ? 'today' : ''].join(' ');
    weekHtml += `<div class="${cls}" aria-label="${done ? t('{day} {n}, trained', { day: DAYS[d.getDay()], n: d.getDate() }) : `${DAYS[d.getDay()]} ${d.getDate()}`}">${DAYS[d.getDay()][0]}<i></i></div>`;
  }
  $('#week').innerHTML = weekHtml;

  // streak = consecutive weeks (ending this or last week) with 3+ workouts
  const { current: streak } = weekStreak();
  $('#streakPill').classList.add('flame');
  $('#streakPill').innerHTML = flameIcon(streak > 0) + (streak ? t('{n}-week streak', { n: streak }) : log.length ? (log.length === 1 ? t('{n} workout', { n: 1 }) : t('{n} workouts', { n: log.length })) : t('Start your streak'));

  const isTrain = TRAIN_DAYS.includes(now.getDay());
  const trainedToday = doneDates.has(localKey(now));
  $('#todayTag').textContent = trainedToday ? t('Done for today — nice work') : isTrain ? t('{day} · training day', { day: DAYS[now.getDay()] }) : t('{day} · rest day', { day: DAYS[now.getDay()] });
  if (trialDaysLeft() !== null) $('#todayTag').textContent += ' · ' + (trialDaysLeft() === 1 ? t('Trial: 1 day left') : t('Trial: {n} days left', { n: trialDaysLeft() }));

  // ---- the hero is the workout: what's next, and Start ----
  const day = upNext(), prog = PROGRAM[day];
  const plan = active ? active.ex.map((x, i) => ({ ...prog.items[i], id: x.id, why: x.why })) : personalizePlan(prog.items).map((pe, i) => ({ ...prog.items[i], id: pe.id, why: pe.why || pe.warn }));
  const first = EX_BY_ID[plan[0].id];
  const shown = plan.slice(0, 3);
  const easy = active ? active.easy : easyWeek();
  $('#easyCard').innerHTML = easy ? `<div class="card easy-card"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
      <div><div class="eyebrow" style="color:var(--ok)">${t('Easy week')}</div><h3 style="margin-top:4px">${t('Recover to get stronger')}</h3>
      <div class="small muted">${t("You've trained hard for {n} weeks. This week: one fewer set and 10% less weight on everything. Joints and tendons catch up, and you come back stronger.", { n: P().age === '30' ? 5 : 4 })}</div></div></div>
      ${active ? '' : `<button class="btn btn-ghost" id="skipEasy" style="margin-top:12px;min-height:40px;font-size:13px">${t('Skip easy week')}</button>`}</div>` : '';
  $('#nextCard').innerHTML = `<div>
    <div class="tag eyebrow">${active ? t('In progress') : trainedToday ? t('Next session') : t('Up next')} · ${t('{n} of 3 this week', { n: Math.min(weekDone + (trainedToday || active ? 0 : 1), 3) })}</div>
    <h1 class="display">${progTitle(prog)}</h1>
    <div class="meta">${prog.cali ? t('Calisthenics') + ' · ' : ''}${esc(prog.focus)} · ${t('{n} exercises', { n: prog.items.length })} · ~${prog.mins || 45} min</div>
    <div class="row2">
      <div class="avatars">${shown.map((it) => `<div class="mini" data-media="${it.id}"><div class="rigbox"></div>${imgTag(it.id)}</div>`).join('')}${prog.items.length > 3 ? `<div class="more">+${prog.items.length - 3}</div>` : ''}</div>
      <span class="small">${esc(t('{name} first', { name: first.name }))}</span>
    </div>
    <button class="btn btn-primary btn-block" id="startBtn">${active ? t('Resume workout') : t('Start workout')}</button>
    ${!isTrain && !active ? `<div class="note">${t('Plan: Mon · Wed · Fri — rest days help, but you can train anytime.')}</div>` : ''}
  </div>`;

  // ---- full exercise list, one tap away ----
  $('#exList').innerHTML = `<summary>${t('See all {n} exercises', { n: plan.length })}${plan.some((x) => x.why) ? ' · ' + t('adjusted for you') : ''}</summary>
    <div style="margin-top:6px">${plan.map((it) => `
      <button class="ex-line" style="width:100%;text-align:left" data-ex="${it.id}">
        ${mediaHtml(it.id)}
        <div><h3>${esc(EX_BY_ID[it.id].name)}</h3><div class="small muted">${t('{n} sets', { n: it.sets })} · ${it.lo}–${it.hi} ${it.timed ? t('sec') : t('reps')}${it.perSide ? ' / ' + t('side') : ''}</div>${it.why ? `<div class="small swap-note">${esc(it.why)}</div>` : ''}</div>
        <svg class="icon chev" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M9 6l6 6-6 6"/></svg>
      </button>`).join('')}</div>`;

  // ---- switch focus: gym rotation or a calisthenics area ----
  const cali = Object.keys(PROGRAM).filter((k) => PROGRAM[k].cali);
  const gym = isLocked(nextDay()) ? 'A' : nextDay();
  const tile = (key, label, sub, wide) => {
    const lv = progLevels(key), back = Object.keys(lv).every((m) => BACK_VIEW.has(m));
    if (isLocked(key)) return `<button class="tile2 locked ${wide ? 'wide' : ''}" data-lock="${key}" aria-label="${t('{label} (locked)', { label })}">
      <span class="map">${MuscleMap.svg(lv, { views: back ? 'back' : 'front' })}</span><span><b>${label}</b><small>${sub}</small></span>${LOCK}</button>`;
    return `<button class="tile2 ${wide ? 'wide' : ''} ${(pick || '') === (key === gym ? '' : key) ? 'on' : ''}" data-pick="${key === gym ? '' : key}" aria-pressed="${(pick || '') === (key === gym ? '' : key)}">
      <span class="map">${MuscleMap.svg(lv, { views: back ? 'back' : 'front' })}</span><span><b>${label}</b><small>${sub}</small></span></button>`;
  };
  $('#focus').innerHTML = active ? '' : `<div class="row" style="justify-content:space-between"><div class="eyebrow">${t('Switch focus')}</div>
      ${license ? '' : `<button class="unlock-link" data-lock="all">${LOCK}${t('Unlock everything · {price}', { price: SHOP.price })}</button>`}</div>
    <div class="tiles">${tile(gym, t('Gym · {name}', { name: license ? PROGRAM[gym].name : PROGRAM.A.name }), license ? esc(t('Alternates dumbbell & barbell days')) : t('Free · full-body dumbbell day'), true)}

// animated stage with phase label + play/pause + slow-mo
// animated stage with phase label, play/pause, slow-mo and a range-of-motion scrubber
function mountStage(container, ex, small) {
  container.innerHTML = `<div class="stage">${small ? '' : `<div class="phase">…</div>
    <div class="ctrls"><button data-c="pp" aria-label="${t('Pause')}">${ICON.pause}</button><button data-c="slow" aria-label="${t('Slow motion')}">½×</button></div>`}</div>
    ${small ? '' : `<div class="scrub">
      <input type="range" min="0" max="1000" value="0" aria-label="${t('Drag through the full range of motion')}">
      <div class="scrub-labels">${ex.tempo.map((p) => `<span style="flex:${p.dur}">${esc(p.label)}</span>`).join('')}</div>
      <div class="small muted scrub-hint">${t('Drag to move through the full range of motion')}</div>
    </div>`}`;
  const stage = container.firstElementChild, phase = $('.phase', stage), pp = $('[data-c=pp]', stage), range = $('.scrub input', container);
  let dragging = false;
  const anim = IronRig.create(stage, ex, {
    fit: !small,
    onPhase: (l, d) => { if (phase) phase.textContent = d ? t('{label} · {n} sec', { label: l, n: d }) : l; },
    onTime: (t, cyc) => { if (range && !dragging) range.value = Math.round((t / cyc) * 1000); },
  });
  const setPlaying = (on) => { on ? anim.play() : anim.pause(); if (pp) pp.innerHTML = on ? ICON.pause : ICON.play; };
  stage.addEventListener('click', (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    if (b.dataset.c === 'pp') setPlaying(!anim.isPlaying());
    if (b.dataset.c === 'slow') { b.classList.toggle('on'); anim.setSpeed(b.classList.contains('on') ? 0.5 : 1); }
  });
  if (range) {
    // scrubbing pauses the demo; Play resumes from wherever you let go
    range.addEventListener('pointerdown', () => { dragging = true; setPlaying(false); });
    range.addEventListener('input', () => { setPlaying(false); anim.seek((range.value / 1000) * anim.cycle); });
    ['pointerup', 'pointercancel', 'change'].forEach((ev) => range.addEventListener(ev, () => { dragging = false; }));
  }
  return anim;
}

// PROGRESS — estimated 1RM (Epley), personal records, charts
// =====================================================
const e1rm = (w, r) => (w > 0 && r > 0 ? Math.round(w * (1 + Math.min(r, 12) / 30)) : 0);
// One point per session: the best set by estimated 1RM (weighted) or most reps/seconds (bodyweight)
function liftHistory(id) {
  const out = [];
  log.forEach((l) => l.ex.filter((x) => x.id === id).forEach((x) => {
    const done = x.sets.filter((s) => s.done && (+s.r || 0) > 0);
    if (!done.length) return;
    const weighted = done.some((s) => +s.w > 0);
    const best = done.reduce((b, s) => {
      const v = weighted ? e1rm(+s.w, +s.r) : +s.r;
      return v > b.v ? { v, w: +s.w || 0, r: +s.r } : b;
    }, { v: -1 });
    out.push({ date: l.date, ts: l.ts || new Date(l.date + 'T18:00').getTime(), weighted, ...best });
  }));
  out.sort((a, b) => a.ts - b.ts);
  let top = -1; out.forEach((p) => { p.pr = p.v > top; if (p.pr) top = p.v; });
  return out;
}
const fmtDate = (d) => new Date(d + 'T12:00').toLocaleDateString(LOCALE, { month: 'short', day: 'numeric' });
const pointText = (p, ex) => p.weighted ? t('{w} lb × {r} · est. 1RM {v} lb', { w: p.w, r: p.r, v: p.v }) : `${p.r} ${ex.timed ? t('sec') : t('reps')}`;

// Single-series line chart (accent 2px line, 8px dots, recessive grid). Tap a point to read it.
function chartSvg(pts, ex) {
  if (pts.length < 2) return '';
  const W = 320, H = 132, L = 34, R = 12, T = 16, B = 22;
  const vs = pts.map((p) => p.v), lo = Math.min(...vs), hi = Math.max(...vs), pad = Math.max(1, (hi - lo) * 0.15);
  const y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const x = (i) => L + ((W - L - R) * i) / (pts.length - 1), y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const ticks = [y0, (y0 + y1) / 2, y1].map((v) => Math.round(v));
  const best = pts.reduce((b, p, i) => (p.v >= pts[b].v ? i : b), 0), last = pts.length - 1;
  return `<div class="chart" data-ex-chart="${ex.id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('{name} progress, {n} sessions, best {best}', { name: ex.name, n: pts.length, best: pointText(pts[best], ex) }))}">
      ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L - 6}" y="${y(v) + 3.5}" class="tick" text-anchor="end">${v}</text>`).join('')}
      <text x="${L}" y="${H - 5}" class="tick">${fmtDate(pts[0].date)}</text><text x="${W - R}" y="${H - 5}" class="tick" text-anchor="end">${fmtDate(pts[last].date)}</text>
      <path d="M${pts.map((p, i) => `${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' L')}" class="line"/>
      ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" class="dot ${p.pr ? 'pr' : ''}"/><circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="14" class="hit" data-i="${i}"/>`).join('')}
      <text x="${Math.min(W - R, Math.max(L, x(best)))}" y="${y(pts[best].v) - 9}" class="lbl" text-anchor="${best === last ? 'end' : best === 0 ? 'start' : 'middle'}">${t('Best {n}', { n: pts[best].v })}</text>
    </svg>
    <div class="small muted chart-read" data-default="${esc(`${fmtDate(pts[last].date)} · ${pointText(pts[last], ex)}`)}">${fmtDate(pts[last].date)} · ${pointText(pts[last], ex)}</div>
  </div>`;
}
// tap/hover a point → read its value under the chart
document.addEventListener('click', (e) => {
  const hit = e.target.closest('.chart .hit'); if (!hit) return;
  const box = hit.closest('.chart'), ex = EX_BY_ID[box.dataset.exChart], p = liftHistory(ex.id)[+hit.dataset.i];

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

function startWorkout() {
  if (!active) {
    const day = upNext(), easy = easyWeek();
    active = {
      day, start: Date.now(), step: 0, easy,
      ex: personalizePlan(PROGRAM[day].items).map((pe, i) => {
        const it = PROGRAM[day].items[i], s = suggest({ ...it, id: pe.id });
        // easy week: 10% under your last working weight, one fewer set
        const lastW = Math.max(0, ...(lastFor(pe.id)?.sets.filter((x) => x.done).map((x) => +x.w || 0) || [0]));
        const w = easy && lastW > 0 ? Math.max(5, Math.round((lastW * 0.9) / 5) * 5) : s.w;
        return { id: pe.id, orig: it.id, why: pe.why || pe.warn || '', sets: Array.from({ length: easy ? Math.max(1, it.sets - 1) : it.sets }, () => ({ w, r: it.hi, done: false })) };
      }),
    };
    saveActive();
  }
  $('#workout').classList.add('open');
  keepAwake(true);
  renderStep();
}
const saveActive = () => store.set('iron40_active', active);

      <div class="small muted" style="min-width:42px;text-align:right">${Math.min(step, total - 1)}/${total - 1}</div>
    </div>`;

  if (step === 0) {
    $('#workoutInner').innerHTML = head + `

// Pick any alternative for this slot; sets reset with a fresh suggestion
function openSwap(it, rec) {
  const base = EX_BY_ID[rec.orig || it.id];
  const others = new Set(active.ex.filter((x) => x !== rec).map((x) => x.id));
  const opts = [base, ...alternatives(base.id, it.timed).filter((e) => !others.has(e.id))].filter((e, i, a) => a.indexOf(e) === i).slice(0, 7);
  openModal(`<h2 class="display">${t('Swap exercise')}</h2><div class="small muted">${t('Same muscles, filtered for your joints and equipment.')}</div>
    ${opts.map((e) => `<button class="ex-line swap-opt ${e.id === rec.id ? 'on' : ''}" style="width:100%;text-align:left" data-swap="${e.id}">${mediaHtml(e.id)}
      <div><h3>${esc(e.name)}</h3><div class="small muted">${e.id === base.id ? t('Original') : esc(e.mus.p.map((m) => MUSCLES[m]).join(' · '))}${fits(e) ? '' : ` · ${esc(whyNot(e))}`}</div></div></button>`).join('')}

  mountMedia($('#modalBody'));

}

  const reps = active.ex.reduce((sum, e, i) => sum + (prog.items[i].timed ? 0 : e.sets.filter((s) => s.done).reduce((a, s) => a + (+s.r || 0), 0)), 0);

    </div>`;
  $('#wPrev').onclick = () => { active.step--; saveActive(); renderStep(); };
  $('#wClose').onclick = () => closeWorkout();
  $('#wSave').onclick = () => {
    log.push({ date: localKey(new Date()), ts: Date.now(), day: active.day, mins, ex: active.ex.map((e) => ({ id: e.id, sets: e.sets.map((s) => ({ w: +s.w || 0, r: +s.r || 0, done: s.done, ...(s.rir != null ? { rir: s.rir } : {}) })) })), ...(active.easy ? { easy: true } : {}) });

function closeWorkout() {

}

// ---------- rest timer ----------
let restEnd = 0, restTotal = 0, restInt = 0, restRaf = 0, restShown = -1;
const CIRC = 2 * Math.PI * 52;
$('#restBar').style.strokeDasharray = CIRC;
// 60 tick marks around the dial, a longer one every 5
$('#restTicks').innerHTML = Array.from({ length: 60 }, (_, i) => {
  const a = (i / 60) * 2 * Math.PI, r1 = i % 5 ? 56.5 : 55.5, r2 = 58.5;
  return `<line class="${i % 5 ? '' : 'big'}" x1="${(60 + r1 * Math.cos(a)).toFixed(2)}" y1="${(60 + r1 * Math.sin(a)).toFixed(2)}" x2="${(60 + r2 * Math.cos(a)).toFixed(2)}" y2="${(60 + r2 * Math.sin(a)).toFixed(2)}"/>`;
}).join('');
const restTicks = [...$('#restTicks').children];

let restSet = null; // the set being rated
$('#restEffort').addEventListener('click', (e) => {
  const b = e.target.closest('[data-rir]'); if (!b || !restSet) return;
  restSet.rir = +b.dataset.rir; saveActive();
  $('#restEffort').querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === b));
});
function startRest(sec, nextLabel, set) {
  restSet = set || null;

  $('#restPR').classList.remove('on');
  $('#restEffort').style.display = set ? '' : 'none';
  $('#restEffort').querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', set && +c.dataset.rir === set.rir));
  restTotal = sec; restEnd = Date.now() + sec * 1000;
  $('#restNext').textContent = nextLabel;
  $('#rest').classList.add('open');
  restShown = -1; $('#restRing').classList.remove('done');
  clearInterval(restInt); cancelAnimationFrame(restRaf); tickRest(); restInt = setInterval(tickRest, 250); drawRest();
}
// Smooth sweep every frame; the number, colours and the end beep update on the 250ms tick
function drawRest() {
  const frac = Math.max(0, Math.min(1, (restEnd - Date.now()) / (restTotal * 1000)));
  $('#restBar').style.strokeDashoffset = CIRC * (1 - frac);
  const a = frac * 2 * Math.PI;
  $('#restDot').setAttribute('cx', (60 + 52 * Math.cos(a)).toFixed(2));
  $('#restDot').setAttribute('cy', (60 + 52 * Math.sin(a)).toFixed(2));
  const lit = Math.round(frac * 60);
  restTicks.forEach((t, i) => t.classList.toggle('lit', i < lit));
  if (frac > 0) restRaf = requestAnimationFrame(drawRest);
}
function tickRest() {
  const left = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
  if (left !== restShown) {
    restShown = left;
    $('#restNum').textContent = left ? mss(left) : t('Go');
    $('#restOf').textContent = left ? t('of {time}', { time: mss(restTotal) }) : t('next set');
    const ring = $('#restRing');
    ring.classList.toggle('soon', left > 0 && left <= 10);
    ring.classList.toggle('final', left > 0 && left <= 3);
    if (left > 0 && left <= 3) { navigator.vibrate?.(40); tick(); }
  }
  if (left <= 0) {
    clearInterval(restInt); $('#restRing').classList.add('done');
    beep(); navigator.vibrate?.([400, 150, 400, 150, 400]);
    setTimeout(() => { if (restShown === 0) stopRest(); }, 700);
  }
}
function stopRest() { clearInterval(restInt); cancelAnimationFrame(restRaf); $('#rest').classList.remove('open'); }
$('#restSkip').onclick = stopRest;
const nudgeRest = (sec) => {
  if (!$('#rest').classList.contains('open')) return;
  const left = (restEnd - Date.now()) / 1000;
  if (left + sec < 1) return stopRest();
  restEnd += sec * 1000; restTotal = Math.max(restTotal + (sec > 0 ? sec : 0), Math.ceil(left + sec));
  restShown = -1; cancelAnimationFrame(restRaf); tickRest(); drawRest();
};
$('#restAdd').onclick = () => nudgeRest(15);
$('#restSub').onclick = () => nudgeRest(-15);
let audio, audioOut;
// iPhone only plays Web Audio from a context started inside a tap, and mutes it with the ring switch
// unless the session is marked as playback, so prime it on every set check-off.
function primeAudio() {
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      const comp = audio.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 6; comp.ratio.value = 8; comp.attack.value = 0.002; comp.release.value = 0.12;
      audioOut = audio.createGain(); audioOut.gain.value = 1.6;

document.addEventListener('pointerdown', primeAudio, { once: true });
function tone(freq, at, dur, gain = 0.8, type = 'square') {

    const o = audio.createOscillator(), g = audio.createGain();
    o.type = k ? 'triangle' : type; o.frequency.value = freq * mult;
    o.connect(g); g.connect(audioOut);

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
    g.gain.setValueAtTime(peak, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  });
}
// Short tick for 3-2-1
function tick() { try { primeAudio(); tone(1320, 0, 0.09, 0.55); } catch {} }
// Rest over: three loud two-tone alarm bursts (~1.6s)
function beep() {
  try {
    primeAudio();
    [0, 0.55, 1.1].forEach((at) => { tone(1046.5, at, 0.18, 0.95); tone(1568, at + 0.2, 0.26, 0.95); });
  } catch {}
}

// =====================================================
// PR CELEBRATION — a set that beats every earlier session's best (est. 1RM, or reps for bodyweight)
// =====================================================
function prCheck(id, st, ex) {
  const w = +st.w || 0, r = +st.r || 0; if (!r) return null;
  const weighted = w > 0, v = weighted ? e1rm(w, r) : r;
  const hist = liftHistory(id).filter((p) => p.weighted === weighted);
  if (!hist.length) return null; // first time logging it: nothing to beat yet
  active.pr = active.pr || {};
  const key = id + (weighted ? ':w' : ':r');
  const was = Math.max(...hist.map((p) => p.v)), base = Math.max(was, active.pr[key] || 0);
  if (v <= base) return null;
  active.pr[key] = v; saveActive();
  return { weighted, v, was, w, r, unit: ex.timed ? t('sec') : t('reps') };
}
function celebratePR(pr, ex) {
  $('#restPR').innerHTML = `<div class="t">${t('New personal record')}</div><div class="v">${esc(ex.name)} · ${pr.weighted ? `${ex.bw ? '+' : ''}${pr.w} lb × ${pr.r}` : `${pr.r} ${pr.unit}`}</div>
    <div class="small muted">${pr.weighted ? t('Est. 1RM {v} lb · up from {was} lb', { v: pr.v, was: pr.was }) : t('Up from {was} {unit}', { was: pr.was, unit: pr.unit })}</div>`;
  $('#restPR').classList.add('on');
  navigator.vibrate?.([30, 40, 30, 40, 120]);
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.09;
      o.type = 'triangle'; o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.start(t); o.stop(t + 0.4);

  } catch {}

}
function confetti() {
  const c = $('#confetti'), dpr = Math.min(2, devicePixelRatio || 1);
  c.hidden = false; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#ff3d6b', '#ff8a5c', '#ffb020', '#ffd23f', '#4ade9b', '#ffffff'];
  const ps = Array.from({ length: 140 }, (_, i) => ({
    x: innerWidth / 2 + (Math.random() - .5) * 60, y: innerHeight * .38,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
    w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, c: cols[i % cols.length],
  }));
  const t0 = performance.now();
  (function frame(t) {
    const k = (t - t0) / 2400; g.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach((p) => {
      p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      g.save(); g.globalAlpha = Math.max(0, 1 - k * k); g.translate(p.x, p.y); g.rotate(p.rot);

// =====================================================
// WEIGHT / REPS WHEEL — tap a set's number to spin it instead of typing
// =====================================================
const WI = 44; // wheel item height
const fmtW = (v) => (v % 1 ? v.toFixed(1) : String(v));
function fillWheel(el, values, current, label) {
  el._values = values;
  el.innerHTML = values.map((v) => `<div class="wi">${label(v)}</div>`).join('');
  let idx = values.reduce((b, v, i) => (Math.abs(v - current) < Math.abs(values[b] - current) ? i : b), 0);
  el.scrollTop = idx * WI; el._idx = idx; styleWheel(el);

    const d = i - top;
    items[i].style.transform = `rotateX(${(-d * 20).toFixed(1)}deg)`;
    items[i].style.opacity = Math.max(.15, 1 - Math.abs(d) * .28).toFixed(2);
  }
  const idx = Math.max(0, Math.min(items.length - 1, Math.round(top)));

}

['#wsW', '#wsR'].forEach((sel) => {
  const el = $(sel); let raf = 0;
  el.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => styleWheel(el)); }, { passive: true });
  el.addEventListener('click', (e) => { const i = [...el.children].indexOf(e.target.closest('.wi')); if (i >= 0) el.scrollTo({ top: i * WI, behavior: 'smooth' }); });
  el.addEventListener('keydown', (e) => {
    const step = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0; if (!step) return;
    e.preventDefault(); el.scrollTo({ top: (el._idx + step) * WI, behavior: 'smooth' });
