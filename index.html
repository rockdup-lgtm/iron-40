const flameIcon = (lit) => `<svg class="flame-ic ${lit ? 'lit' : 'out'}" viewBox="0 0 16 18" aria-hidden="true"><path fill="url(#g-flame)" d="M8 0c.6 3-2.2 4.4-3.6 6.6C3.3 8.3 2 9.6 2 12a6 6 0 0 0 12 0c0-2.6-1.4-4.3-2.3-5.6-.3 1.4-.9 2.3-1.9 2.8C10.4 5.6 9.9 2.3 8 0z"/><path fill="#ffe9a8" opacity=".85" d="M8 9.5c-.2 1.3-1.8 2-1.8 3.8a1.8 1.8 0 0 0 3.6 0c0-1.3-1-2.3-1.8-3.8z"/></svg>`;
const mondayOf = (d) => { const m = new Date(d); m.setHours(12, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; };
// A streak week = 3+ workouts. Current streak counts this week once it hits 3, otherwise ends last week.
function weekStreak() {
  const weeks = {};
  log.forEach((l) => { const k = localKey(mondayOf(new Date(l.date + 'T12:00'))); weeks[k] = (weeks[k] || 0) + 1; });
  const w = mondayOf(new Date()); let current = 0;
  if ((weeks[localKey(w)] || 0) < 3) w.setDate(w.getDate() - 7);
  while ((weeks[localKey(w)] || 0) >= 3) { current++; w.setDate(w.getDate() - 7); }
  let longest = 0, run = 0;
  if (log.length) {
    const end = mondayOf(new Date());
    for (const d = mondayOf(new Date(log.reduce((a, l) => (l.date < a ? l.date : a), log[0].date) + 'T12:00')); d <= end; d.setDate(d.getDate() + 7)) {
      run = (weeks[localKey(d)] || 0) >= 3 ? run + 1 : 0; longest = Math.max(longest, run);
    }
  }
  return { current, longest };
}
const HM_WEEKS = 20;
function heatmapCard() {
  const byDay = {};
  log.forEach((l) => {
    const b = byDay[l.date] || (byDay[l.date] = { sets: 0, names: [] });
    b.sets += l.ex.reduce((a, e) => a + e.sets.filter((s) => s.done).length, 0);
    b.names.push(PROGRAM[l.day]?.name || l.day);
  });
  const today = new Date(), todayKey = localKey(today), start = mondayOf(today); start.setDate(start.getDate() - (HM_WEEKS - 1) * 7);
  let cells = '', months = '', lastMonth = -1, workouts = 0;
  for (let wk = 0; wk < HM_WEEKS; wk++) {
    const mon = new Date(start); mon.setDate(start.getDate() + wk * 7);
    months += `<span>${mon.getMonth() !== lastMonth ? mon.toLocaleDateString(LOCALE, { month: 'short' }) : ''}</span>`; lastMonth = mon.getMonth();
    for (let dd = 0; dd < 7; dd++) {
      const d = new Date(mon); d.setDate(mon.getDate() + dd);
      if (localKey(d) > todayKey) { cells += '<i></i>'; continue; }
      const k = localKey(d), b = byDay[k], n = b ? b.sets : 0;
      if (b) workouts += b.names.length;
      const lv = !b ? 0 : n <= 8 ? 1 : n <= 16 ? 2 : n <= 24 ? 3 : 4;
      const label = `${d.toLocaleDateString(LOCALE, { weekday: 'short', month: 'short', day: 'numeric' })} · ${b ? `${b.names.join(' + ')} · ${t('{n} sets', { n })}` : t('rest day')}`;
      cells += `<button class="l${lv}${k === localKey(today) ? ' today' : ''}" data-hm="${esc(label)}" aria-label="${esc(label)}"></button>`;
    }

  return `<div class="card" id="hmCard"><h3>${t('Training streak')}</h3>
    <div class="hm-stats">
      <div><b>${flameIcon(current > 0)}${current}</b><span>${t('week streak')}</span></div>
      <div><b>${longest}</b><span>${t('best streak')}</span></div>
      <div><b>${workouts}</b><span>${t('workouts')}</span></div>

      <div class="hm"><b>${DAYS[1][0]}</b><b></b><b>${DAYS[3][0]}</b><b></b><b>${DAYS[5][0]}</b><b></b><b>${DAYS[0][0]}</b>${cells}</div></div>
    <div class="hm-foot"><span id="hmInfo">${t('A streak week = 3+ workouts. Tap a day.')}</span>

}

// RECOVERY — 40+: primary muscles need ~72h, secondary ~48h; 30s: ~48h / ~36h
// =====================================================
function recoveryState() {
  const now = Date.now(), state = {};
  log.forEach((l) => {
    const t = l.ts || new Date(l.date + 'T18:00').getTime();
    l.ex.forEach((e) => {
      if (!e.sets.some((s) => s.done)) return;
      const ex = EX_BY_ID[e.id];
      const mark = (m, need) => { const cur = state[m]; const left = t + need * 3.6e6; if (!cur || left > cur.t + cur.need * 3.6e6) state[m] = { t, need }; };
      const [pri, sec] = P().age === '30' ? [48, 36] : [72, 48];
      ex.mus.s.forEach((m) => mark(m, sec));
      ex.mus.p.forEach((m) => mark(m, pri));
    });
  });
  const out = {};
  Object.keys(MUSCLES).forEach((m) => {
    const st = state[m];
    out[m] = st ? Math.min(100, Math.round(((now - st.t) / 3.6e6 / st.need) * 100)) : 100;
  });
  return out;
}

      <div class="small muted" style="margin-bottom:10px">${t('Everything is stored only on this device. Save a backup now and then, and use it to move to a new phone.')}</div>
      <div class="row" style="flex-wrap:wrap"><button class="btn btn-ghost data-btn" id="dExport">${t('Save backup')}</button><button class="btn btn-ghost data-btn" id="dCsv">${t('Export CSV')}</button>
        <label class="btn btn-ghost data-btn">${t('Restore')}<input type="file" id="dImport" accept=".json,application/json" hidden></label></div>
      <div class="small" id="dMsg" style="margin-top:8px"></div></div>`}
    <button class="btn btn-primary btn-block" data-m="ok">${first ? t("I understand — let's lift") : t('Save')}</button>`,
    (a) => {
      if (a !== 'ok') return;
      try { sessionStorage.removeItem('iron40_profile_draft'); } catch {}
      profile = cur; store.set('iron40_profile', profile); store.set('iron40_ack', true);
      showTab(document.querySelector('#tabs button.on')?.dataset.tab || 'today');
    });
  $('#modalBody').onclick = (e) => {
    const lb = e.target.closest('[data-lang]');
    if (lb) {
      if (lb.dataset.lang === LANG) return;
      // keep the choices made so far: first launch keeps a draft (the safety note still shows), otherwise save like Save does
      if (first) { try { sessionStorage.setItem('iron40_profile_draft', JSON.stringify(cur)); } catch {} }
      else { profile = cur; store.set('iron40_profile', profile); }
      return setLang(lb.dataset.lang);
    }
    const mb = e.target.closest('[data-multi]');
    if (mb) { const k = mb.dataset.multi, v = mb.dataset.v; cur[k] = cur[k].includes(v) ? cur[k].filter((x) => x !== v) : [...cur[k], v]; mb.classList.toggle('on'); return; }
    const b = e.target.closest('[data-sex],[data-age]'); if (!b) return;
    const k = b.dataset.sex ? 'sex' : 'age'; cur[k] = b.dataset[k];
    b.parentElement.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === b));
  };
}
$('#profileBtn').addEventListener('click', () => openProfile(false));

// =====================================================
// Backup / restore / CSV export — all on-device, no account
// =====================================================
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const today = () => localKey(new Date());
$('#modalBody').addEventListener('click', (e) => {
  if (e.target.closest('#dExport')) {
    const backup = { app: 'iron40', version: 1, exportedAt: new Date().toISOString(), profile, license, log, active, pick };
    download(`iron40-backup-${today()}.json`, JSON.stringify(backup, null, 1), 'application/json');
    $('#dMsg').textContent = t('Backup saved. Keep it somewhere safe (Files, iCloud Drive, email to yourself).');
  }
  if (e.target.closest('#dCsv')) {
    const rows = [['date', 'workout', 'exercise', 'set', 'weight_lb', 'reps_or_sec', 'done', 'est_1rm_lb']];
    log.forEach((l) => l.ex.forEach((x) => x.sets.forEach((st, i) => rows.push([l.date, PROGRAM[l.day]?.name || l.day, EX_BY_ID[x.id]?.name || x.id, i + 1, st.w || 0, st.r || 0, st.done ? 'yes' : 'no', st.done ? e1rm(+st.w, +st.r) || '' : '']))));
    download(`iron40-workouts-${today()}.csv`, rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
    $('#dMsg').textContent = t('CSV saved — opens in Numbers, Excel or Google Sheets.');
  }
});
const NOT_BACKUP = () => t('That file isn’t an Iron 40 backup.');
$('#modalBody').addEventListener('change', async (e) => {
  if (e.target.id !== 'dImport' || !e.target.files[0]) return;
  const msg = $('#dMsg');
  try {
    const data = JSON.parse(await e.target.files[0].text());
    if (data.app !== 'iron40' || !Array.isArray(data.log)) throw new Error(NOT_BACKUP());
    const from = String(data.exportedAt || '').slice(0, 10) || t('this backup');
    if (!confirm(data.log.length === 1 ? t('Restore {n} workout from {date}? This replaces the {m} on this device.', { n: 1, date: from, m: log.length })
      : t('Restore {n} workouts from {date}? This replaces the {m} on this device.', { n: data.log.length, date: from, m: log.length }))) return;
    store.set('iron40_log', data.log);
    data.profile ? store.set('iron40_profile', data.profile) : null;
    data.license ? store.set('iron40_license', data.license) : null;
    data.active ? store.set('iron40_active', data.active) : store.del('iron40_active');
    location.reload();
  } catch (err) { msg.style.color = 'var(--danger)'; msg.textContent = err.message === NOT_BACKUP() ? err.message : t('Couldn’t read that file. Choose the .json backup Iron 40 saved.'); }
});
if (!profile) openProfile(!store.get('iron40_ack', false));

showTab(active ? 'today' : 'body'); // the app always opens on the body map
if (active) renderToday();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
